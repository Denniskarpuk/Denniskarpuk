<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Курс HTML для початківців</title>
</head>
<body>

  <header>
    <h1>Курс HTML для початківців</h1>

    <nav aria-label="Основна навігація">
      <ul>
        <li><a href="index.html">Головна сторінка</a></li>
        <li><a href="lessons.html">Уроки курсу</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Про курс</h2>
      <p>На курсі ви навчитеся створювати вебсторінки.</p>

      <img src="html-course-logo.png"
           alt="Логотип курсу HTML для початківців: код у вигляді кутових дужок на синьому фоні">
    </section>

    <section>
      <h2>Реєстрація</h2>

      <form action="/register" method="post">
        <div>
          <label for="reg-name">Ім'я:</label>
          <input type="text" id="reg-name" name="name" autocomplete="name">
        </div>

        <div>
          <label for="reg-email">Email:</label>
          <input type="email" id="reg-email" name="email" autocomplete="email">
        </div>

        <button type="submit">Зареєструватися</button>
      </form>
    </section>
  </main>

  <footer>
    <p> 2026 Курс HTML для початківців</p>
  </footer>



</body>
</html>
<!--
  Виправлені проблеми доступності:

  1. Додано атрибут lang="uk" тегу <html> — тепер програми читання з екрана
     і браузер правильно визначають мову документа та використовують
     коректну вимову/переклад.

  2. Виправлено логічну структуру заголовків: <h1> використовується один раз
     для назви сторінки, а <h2> — для розділів "Про курс" та "Реєстрація"
     (замість хаотичних чи пропущених рівнів заголовків).

  3. Навігацію обгорнуто у семантичний тег <nav> зі списком <ul>/<li>
     та додано aria-label="Основна навігація", щоб користувачі скрінрідерів
     могли швидко знайти й ідентифікувати блок навігації.

  4. Замінено незрозумілі тексти посилань "Тут" і "Натиснути тут" 
    
  5. Додано атрибут alt до зображення логотипу курсу з описом його змісту 
    
  6. Поля форми правильно підписано за допомогою <label for="..."> +
     відповідного id на полі вводу

  7. Для поля електронної пошти використано type="email" замість type="text" —
     це вмикає вбудовану валідацію браузера та відповідну мобільну клавіатуру.

  8. Основний вміст сторінки обгорнуто в тег <main>, а розділи — в <section>,
     що робить структуру логічно організованою та дозволяє швидко
     переходити між основними блоками за допомогою технологій доступності.
-->
